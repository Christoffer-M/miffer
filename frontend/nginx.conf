server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html; # TanStack Router handles /groceries, /us
  }
  location = /index.html {
    add_header Cache-Control "no-cache"; # phones always get the latest version
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
