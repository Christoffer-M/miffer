services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miffer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: miffer
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miffer"]
      interval: 5s
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgres://miffer:${DB_PASSWORD}@db:5432/miffer
      VIRTUAL_HOST: ${DOMAIN:?set DOMAIN in .env}
      VIRTUAL_PATH: /api/
      VIRTUAL_PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
    networks: [default, proxy]
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PATH: /
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN} # one cert per hostname, so only needed here
    networks: [proxy]
    restart: unless-stopped

volumes:
  pgdata: {}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
