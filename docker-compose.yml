# The whole production stack, self-contained: on the server this file and a .env
# in one folder is all there is. The deploy workflow copies this file there and
# runs `docker compose up -d`. Settings come from .env next to this file:
#   DB_PASSWORD  Postgres password (keep it the same after the first start)
#   DOMAIN       the domain nginx-proxy routes to miffer
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY  for notifications (optional, see README)
#   TAG          image tag to run; the deploy sets it to the commit it built (default: latest)
name: miffer

# json-file logs are unbounded by default; cap them so the server's disk survives.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Service names are DNS names on every network a container joins, and `proxy` is
# shared with every other app on the server. A bare `backend` there answered for
# PugInspect's `backend` too (Oct 2026) and sent its API traffic here. Keep
# anything on `proxy` prefixed with the app name.
services:
  db:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_USER: miffer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: miffer
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miffer"]
      interval: 5s
    restart: unless-stopped

  miffer-backend:
    # Built and pushed by CI from backend/Dockerfile; the server only pulls it.
    image: ghcr.io/christoffer-m/miffer-backend:${TAG:-latest}
    logging: *logging
    environment:
      DATABASE_URL: postgres://miffer:${DB_PASSWORD}@db:5432/miffer
      TRUST_PROXY: "true" # nginx-proxy sets X-Real-IP, which the join rate limit goes by
      # Notifications; without the keys the app just doesn't offer them.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: https://${DOMAIN}
      VIRTUAL_HOST: ${DOMAIN:?set DOMAIN in .env}
      VIRTUAL_PATH: /api/
      VIRTUAL_PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [default, proxy]
    restart: unless-stopped

  miffer-frontend:
    # Built and pushed by CI from frontend/Dockerfile.
    image: ghcr.io/christoffer-m/miffer-frontend:${TAG:-latest}
    logging: *logging
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PATH: /
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN} # one cert per hostname, so only needed here
    healthcheck:
      # 127.0.0.1, not localhost: that can resolve to ::1, which nginx doesn't listen on.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [proxy]
    restart: unless-stopped

volumes:
  pgdata: {}

networks:
  # nginx-proxy's network on the server
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
